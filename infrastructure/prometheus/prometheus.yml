global:
  scrape_interval: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: relayforge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - control-plane-service:8081
          - ingest-service:8082
          - dispatch-service:8083
          - delivery-worker:8084
          - config-server:8888
          - discovery-server:8761
          - webhook-sink:8090
