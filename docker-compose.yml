name: relayforge

x-app: &app
  restart: unless-stopped
  env_file: .env
  environment: &app-environment
    SPRING_PROFILES_ACTIVE: dev
    CONFIG_SERVER_URL: http://config-server:8888
    EUREKA_URL: http://discovery-server:8761/eureka/
    KAFKA_BROKERS: kafka:9092
    REDIS_HOST: redis
    DB_USER: relayforge
    OIDC_ISSUER: http://keycloak:8080/realms/relayforge
    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
  networks: [relayforge]

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: relayforge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U relayforge -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [relayforge]

  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [relayforge]

  kafka:
    image: apache/kafka:4.2.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [relayforge]

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    restart: unless-stopped
    env_file: .env
    command: [start-dev, --health-enabled=true]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://keycloak:8080
      KC_HTTP_ENABLED: "true"
    ports: ["8180:8080"]
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [relayforge]

  discovery-server:
    <<: *app
    build: {context: ., args: {MODULE: discovery-server}}
    ports: ["8761:8761"]
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8761"]
      interval: 5s
      timeout: 3s
      retries: 30

  config-server:
    <<: *app
    build: {context: ., args: {MODULE: config-server}}
    ports: ["8888:8888"]
    depends_on:
      kafka: {condition: service_healthy}
      discovery-server: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8888"]
      interval: 5s
      timeout: 3s
      retries: 30

  control-plane-service:
    <<: *app
    build: {context: ., args: {MODULE: control-plane-service}}
    ports: ["8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      config-server: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 3s
      retries: 40

  ingest-service:
    <<: *app
    build: {context: ., args: {MODULE: ingest-service}}
    ports: ["8082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      config-server: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 5s
      timeout: 3s
      retries: 40

  dispatch-service:
    <<: *app
    build: {context: ., args: {MODULE: dispatch-service}}
    ports: ["8083:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      control-plane-service: {condition: service_healthy}
      config-server: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 5s
      timeout: 3s
      retries: 40

  delivery-worker:
    <<: *app
    build: {context: ., args: {MODULE: delivery-worker}}
    ports: ["8084:8084"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      config-server: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8084"]
      interval: 5s
      timeout: 3s
      retries: 40

  webhook-sink:
    <<: *app
    build: {context: ., args: {MODULE: webhook-sink}}
    ports: ["8090:8090"]
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 5s
      timeout: 3s
      retries: 30

  api-gateway:
    <<: *app
    build: {context: ., args: {MODULE: api-gateway}}
    ports: ["8080:8080"]
    depends_on:
      redis: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      config-server: {condition: service_healthy}
      control-plane-service: {condition: service_healthy}
      ingest-service: {condition: service_healthy}
      dispatch-service: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 40

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    command: [-config.file=/etc/tempo.yml]
    volumes:
      - ./infrastructure/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
    networks: [relayforge]

  prometheus:
    image: prom/prometheus:v3.7.2
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/alerts:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    networks: [relayforge]

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/relayforge-dashboard.json:/var/lib/grafana/dashboards/relayforge.json:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo]
    networks: [relayforge]

networks:
  relayforge: {}

volumes:
  postgres-data: {}
  redis-data: {}
  kafka-data: {}
  prometheus-data: {}
  tempo-data: {}
  grafana-data: {}
