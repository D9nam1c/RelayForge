server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
    bus:
      enabled: true
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:kafka:9092}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,busrefresh
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
