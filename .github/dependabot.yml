version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: {interval: weekly}
    groups:
      spring-platform:
        patterns: ["org.springframework*", "org.springframework.cloud*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: monthly}
