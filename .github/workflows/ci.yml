name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/maven-home/wrapper
            .cache/maven-repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Whitespace policy
        run: git diff --check
      - name: Compile, unit tests, PostgreSQL integration tests, package
        run: MAVEN_USER_HOME="$PWD/.cache/maven-home" ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - run: MAVEN_USER_HOME="$PWD/.cache/maven-home" ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - uses: github/codeql-action/analyze@v4

  containers:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [config-server, discovery-server, api-gateway, control-plane-service, ingest-service, dispatch-service, delivery-worker, webhook-sink]
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.module }} image
        run: docker build --build-arg MODULE=${{ matrix.module }} --tag relayforge/${{ matrix.module }}:${{ github.sha }} .

  filesystem-scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
